services:
  postgres:
    image: postgres:16-alpine
    container_name: prescripto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prescripto
      POSTGRES_PASSWORD: prescripto_dev_local
      POSTGRES_DB: prescripto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prescripto"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: prescripto-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant ships neither curl nor wget — bash's /dev/tcp is the only
      # HTTP-capable check available inside the image. CMD-SHELL defaults to
      # /bin/sh (dash here), which lacks /dev/tcp, so bash must be invoked explicitly.
      # `Connection: close` makes the server close the socket once it has sent
      # the response, so `cat` reaches EOF on its own — reading to completion
      # instead of a fixed byte count means no assumption about the exact
      # length or position of the status line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: prescripto-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@prescripto.fr
      PGADMIN_DEFAULT_PASSWORD: prescripto_dev_admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:
