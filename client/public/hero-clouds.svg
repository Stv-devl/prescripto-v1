<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" fill="none">
  <defs>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>
  <!-- Cloud shapes - golden/amber organic blobs -->
  <ellipse cx="200" cy="250" rx="280" ry="140" fill="#FFC300" fill-opacity="0.12" filter="url(#blur1)" />
  <ellipse cx="700" cy="180" rx="320" ry="160" fill="#FFC300" fill-opacity="0.08" filter="url(#blur2)" />
  <ellipse cx="1100" cy="320" rx="260" ry="130" fill="#FFD54F" fill-opacity="0.1" filter="url(#blur1)" />
  <ellipse cx="400" cy="400" rx="300" ry="120" fill="#FFC300" fill-opacity="0.06" filter="url(#blur2)" />
  <ellipse cx="950" cy="150" rx="200" ry="100" fill="#FFD54F" fill-opacity="0.09" filter="url(#blur3)" />
  <ellipse cx="1300" cy="200" rx="240" ry="140" fill="#FFC300" fill-opacity="0.07" filter="url(#blur1)" />
  <ellipse cx="150" cy="100" rx="180" ry="90" fill="#FFD54F" fill-opacity="0.08" filter="url(#blur3)" />
  <ellipse cx="600" cy="380" rx="250" ry="110" fill="#FFC300" fill-opacity="0.05" filter="url(#blur2)" />
</svg>
